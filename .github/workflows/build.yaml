name: Atualizar perfil

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["gerar_svg.py", "ascii.txt"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar SVGs
        env:
          GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python gerar_svg.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          git diff --staged --quiet || git commit -m "Atualiza stats"
          git pull --rebase
          git push
